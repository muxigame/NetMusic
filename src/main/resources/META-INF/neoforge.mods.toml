modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
    config="netmusic.integrated.mixins.json"

[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId = "touhou_little_maid"
    type = "optional"
    versionRange = "[1.5.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
modId="net_music_list"
type="required"
versionRange="[4.3]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="netmusicbetterlogin"
type="required"
versionRange="[1.0.4]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="muxi_game_core"
type="required"
versionRange="[1.12.3-task14-qa.1,)"
ordering="NONE"
side="BOTH"
